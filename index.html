<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Semester Schedule | Course Planner</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .lucide { width: 1.25rem; height: 1.25rem; vertical-align: middle; }
    </style>
</head>
<body class="light-mode">
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <header>
                <h1 class="logo">Course Hub</h1>
                <p class="subtitle">Plan your academic journey</p>
            </header>

            <nav class="actions">
                <button id="add-course-btn" class="btn btn-primary">
                    <i data-lucide="plus"></i> Add Course
                </button>
                <button id="export-btn" class="btn btn-secondary">
                    <i data-lucide="download"></i> Export JSON
                </button>
                <button id="import-btn" class="btn btn-secondary">
                    <i data-lucide="upload"></i> Import JSON
                </button>
            </nav>

            <div class="stats-card glass">
                <h3>Semester Stats</h3>
                <div class="stat-item">
                    <span>Courses</span>
                    <span id="course-count">0</span>
                </div>
                <div class="stat-item">
                    <span>Total Credits</span>
                    <span id="credit-count">0</span>
                </div>
            </div>

            <footer class="sidebar-footer">
                <p>&copy; 2026 Course Planner Pro</p>
            </footer>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="calendar-container glass">
                <div class="calendar-header">
                    <div class="time-header">Time</div>
                    <div class="day-header">Mon</div>
                    <div class="day-header">Tue</div>
                    <div class="day-header">Wed</div>
                    <div class="day-header">Thu</div>
                    <div class="day-header">Fri</div>
                    <div class="day-header">Sat</div>
                    <div class="day-header">Sun</div>
                </div>
                <div class="calendar-grid" id="calendar-grid">
                    <!-- Grid cells populated via JS -->
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for adding/editing course -->
    <div id="course-modal" class="modal-overlay hidden">
        <div class="modal glass">
            <header class="modal-header">
                <h2 id="modal-title">New Course</h2>
                <button id="close-modal" class="btn-icon"><i data-lucide="x"></i></button>
            </header>
            <form id="course-form">
                <div class="form-group">
                    <label for="course-name">Course Name</label>
                    <input type="text" id="course-name" required placeholder="e.g., Computer Vision">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="teacher">Instructor</label>
                        <input type="text" id="teacher" placeholder="Professor Name">
                    </div>
                    <div class="form-group">
                        <label for="credits">Credits</label>
                        <input type="number" id="credits" min="0" step="0.5" value="3">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="day">Day</label>
                        <select id="day" required>
                            <option value="1">Mon</option>
                            <option value="2">Tue</option>
                            <option value="3">Wed</option>
                            <option value="4">Thu</option>
                            <option value="5">Fri</option>
                            <option value="6">Sat</option>
                            <option value="0">Sun</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="start-time">Start Time</label>
                        <input type="time" id="start-time" required>
                    </div>
                    <div class="form-group">
                        <label for="end-time">End Time</label>
                        <input type="time" id="end-time" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="course-color">Card Color</label>
                        <input type="color" id="course-color" value="#8b5cf6">
                    </div>
                </div>
                <div class="form-group">
                    <label for="syllabus-link">Syllabus Link</label>
                    <input type="url" id="syllabus-link" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label for="notes">Notes / Content</label>
                    <textarea id="notes" rows="3" placeholder="Course description..."></textarea>
                </div>
                <div class="modal-footer">
                    <button type="button" id="delete-course-btn" class="btn btn-danger hidden">Delete Course</button>
                    <button type="submit" class="btn btn-primary">Save Course</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
